[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "surveyjs"
version = "0.9.1"
description = "Python API for SurveyJS Creator (Form Builder) JSON schema and Form response JSON."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "Nova Code BV", email = "contact@novaforms.io"}
]
maintainers = [
    {name = "Bob Leers"},
    {name = "Nova Code BV", email = "contact@novaforms.io"}
]
dependencies = []
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: File Formats :: JSON",
    "Topic :: File Formats :: JSON :: JSON Schema"
]

[project.urls]
Homepage = "https://www.novaforms.io"
Repository = "https://github.com/novacode-nl/python-surveyjs"

[tool.setuptools.packages.find]
include = ["surveyjs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import order
    "B",       # likely bugs
    "UP",      # modern syntax for the supported Python versions
    "C4",      # comprehensions
    "SIM",     # simpler code
    "PIE",     # unnecessary code
    "RUF",     # ruff's own rules
    "CPY",     # copyright header
]
ignore = [
    "UP031",   # %-formatting is fine
]

# The header every Python file starts with, see CONTRIBUTING.md. The year may be
# a range, e.g. 2026-2027.
[tool.ruff.lint.flake8-copyright]
notice-rgx = '\A# Copyright 20\d{2}(-20\d{2})? Nova Code \(https://www\.novaforms\.io\)\n# See LICENSE file for full licensing details\.\n'
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "RUF001",  # typographic apostrophes in translated test texts
    "RUF012",  # plain class attributes on test cases
]

[tool.poetry.group.dev.dependencies]
ruff = "0.17.1"

