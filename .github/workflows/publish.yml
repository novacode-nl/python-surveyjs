name: Publish to PyPI

# Releases whenever a push to main changes the version in pyproject.toml to
# one that is not on PyPI yet, then tags the commit (v0.10.0).
on:
  push:
    branches:
      - main
    paths:
      - pyproject.toml

jobs:
  check:
    name: Check for a new version

    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}
      release: ${{ steps.version.outputs.release }}

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    # PyPI is the record of what has been released: a version it already has
    # (or any other change to pyproject.toml) is skipped.
    - name: Compare the package version with PyPI
      id: version
      run: |
        version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
        echo "version=$version" >> "$GITHUB_OUTPUT"
        status=$(curl -s -o /dev/null -w '%{http_code}' "https://pypi.org/pypi/surveyjs/$version/json")
        if [ "$status" = "404" ]; then
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "Version $version is not on PyPI yet: releasing"
        elif [ "$status" = "200" ]; then
          echo "release=false" >> "$GITHUB_OUTPUT"
          echo "Version $version is already on PyPI: nothing to release"
        else
          echo "Unexpected HTTP status $status from PyPI"
          exit 1
        fi

  build:
    name: Build distributions
    needs: check
    if: needs.check.outputs.release == 'true'

    runs-on: ubuntu-latest

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'

    - name: Build sdist and wheel
      run: |
        python -m pip install build
        python -m build

    - name: Store the distributions
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  publish:
    name: Upload to PyPI
    needs: build

    runs-on: ubuntu-latest

    # Must match the environment configured in the PyPI trusted publisher.
    environment: pypi

    permissions:
      # Trusted Publishing and provenance attestations.
      id-token: write

    steps:
    - name: Fetch the distributions
      uses: actions/download-artifact@v8
      with:
        name: dist
        path: dist/

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  tag:
    name: Tag the release
    needs: [check, publish]

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Check out the repo
      uses: actions/checkout@v7

    # A tag pushed with GITHUB_TOKEN does not trigger other workflows.
    - name: Create and push the tag
      run: |
        git tag "v${{ needs.check.outputs.version }}"
        git push origin "v${{ needs.check.outputs.version }}"
